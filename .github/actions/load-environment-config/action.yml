name: "Load Environment Config"
description: "Loads validated ArgoCD environment settings from the repository"

inputs:
  environment:
    description: "Target environment (dev | prod)"
    required: true

outputs:
  ssm_path_prefix:
    description: "SSM Parameter Store path prefix"
    value: ${{ steps.load.outputs.ssm_path_prefix }}
  mgmt_cluster_label:
    description: "Management Cluster label"
    value: ${{ steps.load.outputs.mgmt_cluster_label }}
  worker_cluster_label:
    description: "Worker Cluster label"
    value: ${{ steps.load.outputs.worker_cluster_label }}
  root_applications:
    description: "Root Application metadata as compact JSON"
    value: ${{ steps.load.outputs.root_applications }}
  automation_vpn_identity:
    description: "Repository-scoped automation VPN identity"
    value: ${{ steps.load.outputs.automation_vpn_identity }}
  automation_vpn_profile_parameter:
    description: "SSM parameter containing the automation VPN profile"
    value: ${{ steps.load.outputs.automation_vpn_profile_parameter }}
  automation_vpn_password_parameter:
    description: "SSM parameter containing the automation VPN password"
    value: ${{ steps.load.outputs.automation_vpn_password_parameter }}
  automation_vpn_expected_tunnel_ip:
    description: "Expected static IPv4 address for the ci-infra automation VPN identity"
    value: ${{ steps.load.outputs.automation_vpn_expected_tunnel_ip }}
  private_network_enabled:
    description: "Whether the VPN-only ArgoCD private entry is enabled"
    value: ${{ steps.load.outputs.private_network_enabled }}
  endpoint_ip_parameter:
    description: "SSM parameter containing the ArgoCD private endpoint IPv4"
    value: ${{ steps.load.outputs.endpoint_ip_parameter }}
  endpoint_hostname_parameter:
    description: "SSM parameter containing the ArgoCD private endpoint hostname"
    value: ${{ steps.load.outputs.endpoint_hostname_parameter }}
  argocd_https_port:
    description: "TCP port exposed by the ArgoCD private endpoint"
    value: ${{ steps.load.outputs.argocd_https_port }}
  mgmt_api_parameter:
    description: "Management Cluster API endpoint SSM parameter"
    value: ${{ steps.load.outputs.mgmt_api_parameter }}
  worker_api_parameter:
    description: "Worker Cluster API endpoint SSM parameter"
    value: ${{ steps.load.outputs.worker_api_parameter }}

runs:
  using: "composite"
  steps:
    - name: "Load environment configuration"
      id: load
      shell: bash
      env:
        TARGET_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        case "${TARGET_ENVIRONMENT}" in
          dev|prod) ;;
          *)
            echo "::error::Unsupported environment: ${TARGET_ENVIRONMENT}"
            exit 1
            ;;
        esac

        CONFIG_FILE="terraform/argocd/environments/${TARGET_ENVIRONMENT}.json"
        CONFIG_PATH="${GITHUB_WORKSPACE}/${CONFIG_FILE}"

        if ! command -v jq >/dev/null 2>&1; then
          echo "::error::jq is required to load environment configuration"
          exit 1
        fi

        if [ ! -f "${CONFIG_PATH}" ]; then
          echo "::error::Environment configuration not found: ${CONFIG_FILE}"
          exit 1
        fi

        SSM_PATH_PREFIX="$(jq -er '.ssm_path_prefix' "${CONFIG_PATH}")"
        MGMT_CLUSTER_LABEL="$(jq -er '.mgmt_cluster_label' "${CONFIG_PATH}")"
        WORKER_CLUSTER_LABEL="$(jq -er '.worker_cluster_label' "${CONFIG_PATH}")"

        if ! jq -e --arg environment "${TARGET_ENVIRONMENT}" '
          .private_network
          | type == "object"
            and (.enabled | type == "boolean")
            and (.argocd_https_port | type == "number")
            and (
              (.enabled | not)
              or (
                (.environment == $environment)
                and (.linode_region | type == "string" and test("^[a-z]{2}-[a-z]+$"))
                and (.internal_domain_parameter_name == "/gitops/platform-access/network/INTERNAL_DOMAIN")
                and (.vpn_public_egress_ip_parameter_name == "/gitops/platform-access/network/VPN_PUBLIC_EGRESS_IP")
                and (.endpoint_ip_parameter_name == ("/gitops/" + $environment + "/platform/argocd/ENDPOINT_IP"))
                and (.endpoint_hostname_parameter_name == ("/gitops/" + $environment + "/platform/argocd/ENDPOINT_HOSTNAME"))
                and (.openvpn_server_public_ipv6 == null)
                and (.argocd_https_port == 443)
                and (.argocd_tls_secret_name == "argocd-server-tls")
              )
            )
        ' "${CONFIG_PATH}" >/dev/null; then
          echo "::error::Invalid private_network configuration: ${CONFIG_FILE}"
          exit 1
        fi

        if ! jq -e '
          .root_applications
          | type == "object"
            and length > 0
            and all(.[];
              (.name | type == "string" and length > 0)
              and (.manifest | type == "string" and length > 0)
            )
        ' "${CONFIG_PATH}" >/dev/null; then
          echo "::error::Invalid root_applications configuration: ${CONFIG_FILE}"
          exit 1
        fi

        if ! jq -e '
          .automation_vpn.identity == "ci-infra"
          and .automation_vpn.profile_ssm_path ==
            "/gitops/platform-access/automation/ci-infra/PROFILE"
          and .automation_vpn.password_ssm_path ==
            "/gitops/platform-access/automation/ci-infra/PASSWORD"
          and (.automation_vpn.expected_tunnel_ip | test("^([0-9]{1,3}\\.){3}[0-9]{1,3}$"))
        ' "${CONFIG_PATH}" >/dev/null; then
          echo "::error::Invalid automation_vpn configuration: ${CONFIG_FILE}"
          exit 1
        fi

        # private_network 的欄位在上面已驗證過形狀，這裡只取值供 health check
        # 把 endpoint 納入隧道內的可達性驗證。
        PRIVATE_NETWORK_ENABLED="$(jq -er '.private_network.enabled' "${CONFIG_PATH}")"
        ENDPOINT_IP_PARAMETER=""
        ENDPOINT_HOSTNAME_PARAMETER=""
        ARGOCD_HTTPS_PORT="$(jq -er '.private_network.argocd_https_port' "${CONFIG_PATH}")"
        if [ "${PRIVATE_NETWORK_ENABLED}" = "true" ]; then
          ENDPOINT_IP_PARAMETER="$(jq -er '.private_network.endpoint_ip_parameter_name' "${CONFIG_PATH}")"
          ENDPOINT_HOSTNAME_PARAMETER="$(jq -er '.private_network.endpoint_hostname_parameter_name' "${CONFIG_PATH}")"
        fi

        ROOT_APPLICATIONS="$(jq -cer '.root_applications' "${CONFIG_PATH}")"
        AUTOMATION_VPN_IDENTITY="$(jq -er '.automation_vpn.identity' "${CONFIG_PATH}")"
        AUTOMATION_VPN_PROFILE_PARAMETER="$(jq -er '.automation_vpn.profile_ssm_path' "${CONFIG_PATH}")"
        AUTOMATION_VPN_PASSWORD_PARAMETER="$(jq -er '.automation_vpn.password_ssm_path' "${CONFIG_PATH}")"
        AUTOMATION_VPN_EXPECTED_TUNNEL_IP="$(jq -er '.automation_vpn.expected_tunnel_ip' "${CONFIG_PATH}")"

        {
          echo "ssm_path_prefix=${SSM_PATH_PREFIX}"
          echo "mgmt_cluster_label=${MGMT_CLUSTER_LABEL}"
          echo "worker_cluster_label=${WORKER_CLUSTER_LABEL}"
          echo "root_applications=${ROOT_APPLICATIONS}"
          echo "automation_vpn_identity=${AUTOMATION_VPN_IDENTITY}"
          echo "automation_vpn_profile_parameter=${AUTOMATION_VPN_PROFILE_PARAMETER}"
          echo "automation_vpn_password_parameter=${AUTOMATION_VPN_PASSWORD_PARAMETER}"
          echo "automation_vpn_expected_tunnel_ip=${AUTOMATION_VPN_EXPECTED_TUNNEL_IP}"
          echo "private_network_enabled=${PRIVATE_NETWORK_ENABLED}"
          echo "endpoint_ip_parameter=${ENDPOINT_IP_PARAMETER}"
          echo "endpoint_hostname_parameter=${ENDPOINT_HOSTNAME_PARAMETER}"
          echo "argocd_https_port=${ARGOCD_HTTPS_PORT}"
          echo "mgmt_api_parameter=${SSM_PATH_PREFIX}/${MGMT_CLUSTER_LABEL}/api-endpoint"
          echo "worker_api_parameter=${SSM_PATH_PREFIX}/${WORKER_CLUSTER_LABEL}/api-endpoint"
        } >> "${GITHUB_OUTPUT}"
