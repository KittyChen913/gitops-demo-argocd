# ──────────────────────────────────────────────────────────────────────────────
# Terraform Apply - dev 環境 Pipeline
# ──────────────────────────────────────────────────────────────────────────────
#
# ⚠️  此 workflow 僅用於 DEV 環境，與 prod 完全隔離。
#     Prod 環境請見 terraform-apply-prod.yml（以 tag 觸發）
#
# 觸發時機：
#   Push 至 master，且異動路徑命中基礎設施相關檔案
#   （docs/README/Markdown 等文件變更不觸發此 pipeline）
#
# 設計原則：
#   - 每次 commit 至 master 皆可自動觸發（高頻執行）
#   - 只 apply dev，不接觸 prod 任何資源
#   - paths allowlist（allowlist > denylist，明確比例外安全）
#     等效效果：排除 *.md、docs/、README.md 等純文件變更
#   - AWS credentials 透過 OIDC 取得（不儲存 key）
#   - GitHub Environment `dev` 可加 branch protection（僅限 master）
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  觸發設計                                                               │
# │  push: branches: [master]  ← dev 允許頻繁觸發                          │
# │  paths: allowlist        ← 只有基礎設施變更才觸發（排除 docs/md）       │
# │  workflow_dispatch       ← 手動補跑（僅限 dev）                        │
# └─────────────────────────────────────────────────────────────────────────┘
# ──────────────────────────────────────────────────────────────────────────────

name: "Terraform Apply - Dev"

on:
  push:
    branches:
      - master
    # ── Path Allowlist（等同 paths-ignore docs）────────────────────────────
    # 僅 dev root、共用 module、ArgoCD manifest 與此 pipeline
    # 的直接依賴變更才觸發。Prod-only、文件與一般 workflow 變更不部署 dev。
    paths:
      - "terraform/argocd/environments/dev.json"
      - "terraform/argocd/dev/**"
      - "argocd/**"
      - ".github/workflows/terraform-apply-dev.yml"
      - ".github/workflows/validation.yml"
      - ".github/workflows/terraform-apply-stage.yml"
      - ".github/workflows/argocd-bootstrap-verification.yml"
      - ".github/actions/**"
      # repo 契約檔：OIDC Role 名稱、AWS region 與共用 SSM 路徑的唯一來源，
      # 由 configure-aws-credentials／get-ssm-parameters 於執行期讀取。
      - "config/shared.json"
      # apply path 會執行 automation VPN tunnel 與 Dev admin password escrow
      # 兩支腳本，因此整個 scripts/ 都算此 pipeline 的直接依賴。
      - "scripts/**"

  # 手動補跑不需要額外輸入；誰在什麼時間觸發由 GitHub 的 run 記錄保存。
  workflow_dispatch:

# 最小化 token 權限
permissions:
  contents: read
  id-token: write

# 同一時間只允許一個 dev apply 執行（排隊，不取消）
concurrency:
  group: "tf-apply-dev"
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1：Workflow 與 Script 品質檢查
  # ────────────────────────────────────────────────────────────────────────────
  quality:
    name: "Validation"
    uses: ./.github/workflows/validation.yml

  # ────────────────────────────────────────────────────────────────────────────
  # Jobs 2-4：分階段執行 dev Terraform Apply；install job 會在結束前完成
  # initial admin password escrow，成功後 self-manage 才能開始。
  # ────────────────────────────────────────────────────────────────────────────
  install-argocd:
    name: "1. Install ArgoCD [dev]"
    needs: quality
    uses: ./.github/workflows/terraform-apply-stage.yml
    with:
      environment: dev
      stage: install
    secrets: inherit

  register-argocd-application:
    name: "2. Register ArgoCD Application [dev]"
    needs: install-argocd
    uses: ./.github/workflows/terraform-apply-stage.yml
    with:
      environment: dev
      stage: self-manage
    secrets: inherit

  register-ateam-application:
    name: "3. Register ATeam Application [dev]"
    needs: register-argocd-application
    uses: ./.github/workflows/terraform-apply-stage.yml
    with:
      environment: dev
      stage: ateam
    secrets: inherit

  verify:
    name: "Verify ArgoCD [dev]"
    needs: register-ateam-application
    uses: ./.github/workflows/argocd-bootstrap-verification.yml
    with:
      environment: dev
    secrets: inherit
