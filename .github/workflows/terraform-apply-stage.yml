name: Terraform Apply Stage

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev | prod)"
        required: true
        type: string
      stage:
        description: "Deployment stage (install | self-manage | ateam)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  apply-stage:
    name: "${{ inputs.stage }} [${{ inputs.environment }}]"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    # 每個 stage 現在是自己獨立的 Terraform root／state
    # （terraform/argocd/<environment>/<stage>/），不再是同一份 state 用
    # -target 切割。三個 root 之間的順序完全由呼叫端 workflow 的
    # needs 鏈保證（install → self-manage → ateam），不靠 Terraform
    # 跨 state 的 depends_on。
    defaults:
      run:
        working-directory: terraform/argocd/${{ inputs.environment }}/${{ inputs.stage }}

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Validate deployment stage"
        env:
          DEPLOY_STAGE: ${{ inputs.stage }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "${ENVIRONMENT}" in
            dev|prod) ;;
            *)
              echo "::error::Unsupported environment: ${ENVIRONMENT}"
              exit 1
              ;;
          esac

          case "${DEPLOY_STAGE}" in
            install|self-manage|ateam) ;;
            *)
              echo "::error::Unsupported deployment stage: ${DEPLOY_STAGE}"
              exit 1
              ;;
          esac

      - name: "Load environment configuration"
        id: environment-config
        uses: ./.github/actions/load-environment-config
        with:
          environment: ${{ inputs.environment }}

      - name: "Terraform Setup (init + AWS auth)"
        uses: ./.github/actions/tf-setup
        with:
          environment: ${{ inputs.environment }}
          component: ${{ inputs.stage }}
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: "Resolve automation VPN targets"
        id: automation-vpn-targets
        shell: bash
        env:
          MGMT_API_PARAMETER: ${{ steps.environment-config.outputs.mgmt_api_parameter }}
          WORKER_API_PARAMETER: ${{ steps.environment-config.outputs.worker_api_parameter }}
        run: |
          set -euo pipefail
          route_targets=()
          health_targets=()
          for parameter_path in "${MGMT_API_PARAMETER}" "${WORKER_API_PARAMETER}"; do
            endpoint="$(aws ssm get-parameter \
              --name "${parameter_path}" \
              --query Parameter.Value \
              --output text)"
            test -n "${endpoint}"
            endpoint_host="${endpoint#*://}"
            endpoint_host="${endpoint_host%%/*}"
            endpoint_host="${endpoint_host%%:*}"
            route_targets+=("${endpoint}")
            health_targets+=("${endpoint_host}:443")
          done
          {
            echo "route_targets<<EOF"
            printf '%s\n' "${route_targets[@]}"
            echo "EOF"
            echo "health_targets<<EOF"
            printf '%s\n' "${health_targets[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: "Open automation VPN tunnel"
        id: automation-vpn
        uses: ./.github/actions/open-automation-vpn-tunnel
        with:
          identity: ${{ steps.environment-config.outputs.automation_vpn_identity }}
          profile-ssm-parameter: ${{ steps.environment-config.outputs.automation_vpn_profile_parameter }}
          password-ssm-parameter: ${{ steps.environment-config.outputs.automation_vpn_password_parameter }}
          expected-tunnel-ip: ${{ steps.environment-config.outputs.automation_vpn_expected_tunnel_ip }}
          route-targets: ${{ steps.automation-vpn-targets.outputs.route_targets }}
          health-targets: ${{ steps.automation-vpn-targets.outputs.health_targets }}

      # 完整、不帶 -target 的 plan。install stage 沿用既有的 -refresh=false
      # （install 資源交由 ArgoCD 自我管理後，refresh 會讀到 kbst provider
      # 缺失的 last-applied annotation）；self-manage／ateam 兩個 root 本來
      # 就不需要這個例外。
      - name: "Terraform Plan (${{ inputs.stage }})"
        id: plan
        env:
          DEPLOY_STAGE: ${{ inputs.stage }}
          TF_IN_AUTOMATION: "true"
        run: |
          REFRESH_ARGS=()
          if [ "${DEPLOY_STAGE}" = "install" ]; then
            REFRESH_ARGS=("-refresh=false")
          fi

          set +e
          terraform plan \
            "${REFRESH_ARGS[@]}" \
            -out="${RUNNER_TEMP}/tfplan.${DEPLOY_STAGE}" \
            -no-color \
            -detailed-exitcode \
            -input=false \
            2>&1 | grep -v -iE "^\s*(token|secret|password)\s*=" \
            | tee "${RUNNER_TEMP}/plan-output.${DEPLOY_STAGE}.txt"
          PLAN_EXIT="${PIPESTATUS[0]}"
          echo "exitcode=${PLAN_EXIT}" >> "${GITHUB_OUTPUT}"

          if [ "${PLAN_EXIT}" -eq 1 ]; then
            echo "::error::terraform plan failed for stage ${DEPLOY_STAGE}"
            exit 1
          fi

      - name: "Skip Apply (no changes)"
        if: steps.plan.outputs.exitcode == '0'
        env:
          DEPLOY_STAGE: ${{ inputs.stage }}
        run: |
          echo "No changes detected for ${DEPLOY_STAGE}; skipping apply."
          echo "## No Changes: \`${DEPLOY_STAGE}\`" >> "${GITHUB_STEP_SUMMARY}"

      # 拆成獨立 state 後，單一 apply 的 blast radius 比以前的窄 -target
      # 更大（例如 install root 一次涵蓋 namespace／p0/p1/p2／worker cluster
      # secret）。新增這道 guard，比照 private-network root 既有的作法，
      # 拒絕任何包含 delete 或 replacement 的 plan，需要人工介入才能繼續。
      - name: "Reject delete or replacement"
        if: steps.plan.outputs.exitcode == '2'
        env:
          DEPLOY_STAGE: ${{ inputs.stage }}
        run: |
          terraform show -json "${RUNNER_TEMP}/tfplan.${DEPLOY_STAGE}" \
            | jq -e 'all(.resource_changes[]?; (.change.actions | index("delete") | not))' \
              >/dev/null || {
                echo "::error::${DEPLOY_STAGE} plan contains delete or replacement; a human must review before this can proceed"
                exit 1
              }

      - name: "Terraform Apply (${{ inputs.stage }})"
        id: apply
        if: steps.plan.outputs.exitcode == '2'
        env:
          DEPLOY_STAGE: ${{ inputs.stage }}
          TF_IN_AUTOMATION: "true"
        run: |
          set +e
          terraform apply \
            -auto-approve \
            -input=false \
            -no-color \
            "${RUNNER_TEMP}/tfplan.${DEPLOY_STAGE}" \
            2>&1 | grep -v -iE "^\s*(token|secret|password)\s*=" \
            | tee "${RUNNER_TEMP}/apply-output.${DEPLOY_STAGE}.txt"
          APPLY_EXIT="${PIPESTATUS[0]}"

          if [ "${APPLY_EXIT}" -ne 0 ]; then
            echo "::error::terraform apply failed for stage ${DEPLOY_STAGE}"
            exit "${APPLY_EXIT}"
          fi

      # private-network 是獨立 root／獨立 state（terraform/argocd/<env>/private-network），
      # 完整、不帶 -target 的 plan/apply，只作用在這個 root 自己的 state。
      - name: "Reconcile private ArgoCD endpoint"
        if: inputs.stage == 'install'
        env:
          TF_IN_AUTOMATION: "true"
        working-directory: terraform/argocd/${{ inputs.environment }}/private-network
        run: |
          set -euo pipefail
          terraform init -input=false

          linode_token="$(aws ssm get-parameter \
            --name /gitops/shared/LINODE_TOKEN \
            --with-decryption \
            --query Parameter.Value \
            --output text)"
          test -n "${linode_token}"
          echo "::add-mask::${linode_token}"

          PLAN_FILE="${RUNNER_TEMP}/tfplan.private-endpoint"

          set +e
          LINODE_TOKEN="${linode_token}" terraform plan \
            -out="${PLAN_FILE}" \
            -no-color \
            -detailed-exitcode \
            -input=false \
            2>&1 | grep -v -iE "^\s*(token|secret|password)\s*=" \
            | tee "${RUNNER_TEMP}/plan-output.private-endpoint.txt"
          PLAN_EXIT="${PIPESTATUS[0]}"
          set -e

          case "${PLAN_EXIT}" in
            0)
              echo "Private endpoint and canonical URL are in sync."
              ;;
            2)
              terraform show -json "${PLAN_FILE}" \
                | jq -e 'all(.resource_changes[]?; (.change.actions | index("delete") | not))' \
                  >/dev/null || {
                    echo "::error::Private endpoint plan contains delete or replacement"
                    exit 1
                  }
              set +e
              LINODE_TOKEN="${linode_token}" terraform apply \
                -auto-approve \
                -input=false \
                -no-color \
                "${PLAN_FILE}" \
                2>&1 | grep -v -iE "^\s*(token|secret|password)\s*=" \
                | tee "${RUNNER_TEMP}/apply-output.private-endpoint.txt"
              APPLY_EXIT="${PIPESTATUS[0]}"
              set -e

              if [ "${APPLY_EXIT}" -ne 0 ]; then
                echo "::error::terraform apply failed for the private endpoint"
                exit "${APPLY_EXIT}"
              fi
              ;;
            *)
              echo "::error::terraform plan failed for the private endpoint"
              exit "${PLAN_EXIT}"
              ;;
          esac

      # Dev initial admin password escrow 與 install 共用已開啟的 Management
      # Cluster tunnel。Cluster credential 先由既有 action 取得，再切換到只信任
      # environment:dev 的專用 OIDC role；Prod 不執行這些 steps。
      - name: "Install kubectl for Dev admin password escrow"
        if: inputs.environment == 'dev' && inputs.stage == 'install'
        uses: azure/setup-kubectl@v5
        with:
          version: "v1.30.0"

      - name: "Fetch Dev Management Cluster credentials from SSM"
        if: inputs.environment == 'dev' && inputs.stage == 'install'
        uses: ./.github/actions/get-ssm-parameters
        with:
          ssm_param_path: >-
            ${{ steps.environment-config.outputs.ssm_path_prefix }}/${{
            steps.environment-config.outputs.mgmt_cluster_label }}

      - name: "Configure Dev admin escrow AWS credentials"
        if: inputs.environment == 'dev' && inputs.stage == 'install'
        uses: ./.github/actions/configure-aws-credentials
        with:
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          role-name: github-oidc-gitops-demo-argocd-dev-admin-escrow-role

      - name: "Escrow Dev ArgoCD initial admin password"
        if: inputs.environment == 'dev' && inputs.stage == 'install'
        working-directory: ${{ github.workspace }}
        env:
          ADMIN_PASSWORD_PARAMETER: ${{ steps.environment-config.outputs.admin_password_parameter }}
        run: |
          set -euo pipefail
          : "${API_ENDPOINT:?Management Cluster API endpoint is required}"
          : "${CA_CERT:?Management Cluster CA certificate is required}"
          : "${TOKEN:?Management Cluster token is required}"
          : "${ADMIN_PASSWORD_PARAMETER:?Dev admin password parameter path is required}"

          umask 077
          kubeconfig_file="$(mktemp "${RUNNER_TEMP}/argocd-admin-kubeconfig.XXXXXX")"
          cleanup_kubeconfig() {
            rm -f -- "${kubeconfig_file}"
          }
          # 正常結束由 EXIT trap 清理；收到終止 signal 時，清理後必須停止執行。
          trap cleanup_kubeconfig EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          trap 'exit 129' HUP
          chmod 600 "${kubeconfig_file}"

          cat >"${kubeconfig_file}" <<KUBECONFIG_EOF
          apiVersion: v1
          kind: Config
          clusters:
          - name: mgmt
            cluster:
              server: ${API_ENDPOINT}
              certificate-authority-data: ${CA_CERT}
          users:
          - name: mgmt
            user:
              token: ${TOKEN}
          contexts:
          - name: mgmt
            context:
              cluster: mgmt
              user: mgmt
          current-context: mgmt
          KUBECONFIG_EOF

          KUBECONFIG="${kubeconfig_file}" \
            ARGOCD_ADMIN_PASSWORD_PARAMETER_NAME="${ADMIN_PASSWORD_PARAMETER}" \
            bash scripts/escrow-argocd-initial-admin-password.sh

      # 同時清掉 escrow OIDC role 的暫時憑證，避免它延續到 tunnel 關閉與 summary
      # 等後續 steps；這幾個 steps 都不需要 AWS。
      - name: "Clear Dev admin escrow credential environment"
        if: always() && inputs.environment == 'dev' && inputs.stage == 'install'
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo "API_ENDPOINT="
            echo "CA_CERT="
            echo "TOKEN="
            echo "AWS_ACCESS_KEY_ID="
            echo "AWS_SECRET_ACCESS_KEY="
            echo "AWS_SESSION_TOKEN="
          } >> "${GITHUB_ENV}"

      - name: "Close automation VPN tunnel"
        if: ${{ always() && steps.automation-vpn.outputs['state-directory'] != '' }}
        uses: ./.github/actions/close-automation-vpn-tunnel
        with:
          state-directory: ${{ steps.automation-vpn.outputs['state-directory'] }}

      # STATUS 以 job.status 為準，而不是只看 apply step 的結果；apply 之後還有
      # private endpoint reconcile 與 Dev admin password escrow 等會失敗的 steps。
      - name: "Write stage summary"
        if: always()
        env:
          DEPLOY_STAGE: ${{ inputs.stage }}
          ENVIRONMENT: ${{ inputs.environment }}
          JOB_STATUS: ${{ job.status }}
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
        run: |
          if [ "${JOB_STATUS}" != "success" ]; then
            STATUS="Failed"
          elif [ "${PLAN_EXIT}" = "0" ]; then
            STATUS="No changes"
          else
            STATUS="Success"
          fi

          {
            echo "## Terraform Stage: \`${DEPLOY_STAGE}\`"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Environment | \`${ENVIRONMENT}\` |"
            echo "| Status | ${STATUS} |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"
