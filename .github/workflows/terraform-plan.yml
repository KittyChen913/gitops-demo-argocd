# ──────────────────────────────────────────────────────────────────────────────
# Terraform Plan - PR 驗證 Pipeline
# ──────────────────────────────────────────────────────────────────────────────
#
# 觸發時機：Pull Request 對 master 且命中 ArgoCD paths，或手動選擇環境
#
# 行為：
#   1. 偵測目標 environment（依 PR label: env:dev / env:prod，預設 dev）
#   2. terraform fmt --check
#   3. terraform validate（install／self-manage／ateam／private-network 四個獨立 root）
#   4. 對四份獨立 state 執行 terraform plan（-detailed-exitcode，不 apply）
#   5. 將 plan 結果以 comment 貼回 PR
#   6. Binary plan 僅保留在 ephemeral Runner，不上傳 artifact
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  文件變更處理                                                           │
# │  此 workflow 使用 paths allowlist，以下變更不會觸發此 pipeline：           │
# │    ✅ *.md / README.md     → 不在 paths allowlist 中                    │
# │    ✅ docs/**              → 不在 paths allowlist 中                    │
# │    ✅ diagram assets       → 不在 paths allowlist 中                    │
# │  注意：GitHub Actions 不允許同一 event 同時使用 paths 和 paths-ignore，   │
# │  此處以 paths allowlist 實現等效的 docs-ignore 效果，且更安全（明確範圍）   │
# └─────────────────────────────────────────────────────────────────────────┘
#
# 安全注意：
#   - prod plan 需明確標 PR label "env:prod"，避免非預期觸發
#   - Plan output 經過截斷，避免 sensitive output 超長洩漏
#   - AWS credentials 透過 OIDC（無 stored secret key）
#   - install／self-manage／ateam／private-network 四個 root 各自獨立 state，
#     互不使用 -target；每個 root 的 plan 若含 delete/replacement 會直接
#     擋下 PR（見各自的 "Reject ... delete or replacement" step）。
# ──────────────────────────────────────────────────────────────────────────────

name: "Terraform Plan"

on:
  pull_request:
    branches: [master]
    # ── Path Allowlist（等同 paths-ignore docs）────────────────────────────
    # 僅在以下路徑發生 PR 變更時觸發：
    #   terraform/**              → Terraform 設定變更
    #   argocd/**                 → ArgoCD bootstrap/install 變更
    #   .github/workflows/...    → CI workflow 本身變更
    #   .github/actions/**       → Composite action 變更
    # *.md、docs/、README.md 不在此 allowlist 中，因此文件變更不觸發 plan。
    paths:
      - "terraform/**"
      - "argocd/**"
      - ".github/workflows/terraform-*.yml"
      - ".github/workflows/terraform-apply-stage.yml"
      - ".github/workflows/terraform-destroy-stage.yml"
      - ".github/actions/**"

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to plan"
        required: true
        type: choice
        options: [all, dev, prod]
        default: all

# 最小化 token 權限（Principle of Least Privilege）
permissions:
  contents: read
  pull-requests: write   # 貼 PR comment
  id-token: write        # OIDC token 取得

# 同一 PR/branch 有新 push 時，取消舊的 plan run，節省 CI minutes
concurrency:
  group: "tf-plan-${{ github.event.pull_request.number || github.run_id }}"
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1：偵測目標 environment
  # 透過 PR label 決定要 plan 哪個 environment
  # ────────────────────────────────────────────────────────────────────────────
  detect-environment:
    name: "Detect Target Environment"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: "Validate OIDC prerequisites"
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          if [ -z "${AWS_ACCOUNT_ID}" ]; then
            echo "::error title=Missing Secret::AWS_ACCOUNT_ID repository secret is not configured"
            echo "See README.md → CI/CD Configuration"
            exit 1
          fi
          echo "AWS Account ID configured ✓"

      - name: "Set environment matrix"
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${INPUT_ENVIRONMENT}" in
              all)
                echo 'matrix={"environment":["dev","prod"]}' >> "${GITHUB_OUTPUT}"
                ;;
              dev|prod)
                echo "matrix={\"environment\":[\"${INPUT_ENVIRONMENT}\"]}" >> "${GITHUB_OUTPUT}"
                ;;
              *)
                echo "::error::Unsupported environment: ${INPUT_ENVIRONMENT}"
                exit 1
                ;;
            esac
            echo "Manual plan target: ${INPUT_ENVIRONMENT}"
            exit 0
          fi

          echo "PR labels: ${LABELS_JSON}"

          # prod plan 需明確標 "env:prod" label 才觸發，避免意外 plan prod
          if echo "${LABELS_JSON}" | grep -q '"env:prod"'; then
            echo 'matrix={"environment":["prod"]}' >> "${GITHUB_OUTPUT}"
            echo "Target: prod (explicit label)"
          elif echo "${LABELS_JSON}" | grep -q '"env:dev"'; then
            echo 'matrix={"environment":["dev"]}' >> "${GITHUB_OUTPUT}"
            echo "Target: dev (explicit label)"
          else
            # 預設：所有 PR 都對 dev 執行 plan
            echo 'matrix={"environment":["dev"]}' >> "${GITHUB_OUTPUT}"
            echo "Target: dev (default)"
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2：Terraform Plan（matrix：每個 environment 獨立執行）
  # 四個獨立 root／state：install、self-manage、ateam、private-network。
  # ────────────────────────────────────────────────────────────────────────────
  plan:
    name: "Plan [${{ matrix.environment }}]"
    needs: detect-environment
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.detect-environment.outputs.matrix) }}
      fail-fast: false

    defaults:
      run:
        working-directory: terraform/argocd/${{ matrix.environment }}

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      # ── Terraform 設定、AWS OIDC 與 terraform init（install root）────────
      - name: "Terraform Setup (init + AWS auth)"
        uses: ./.github/actions/tf-setup
        with:
          environment: ${{ matrix.environment }}
          component: install
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}

      # ── fmt 檢查（一次檢查整個 terraform/ 樹，涵蓋四個 root）───────────────
      - name: "Terraform Format Check"
        id: fmt
        run: terraform fmt -check -recursive -diff "${GITHUB_WORKSPACE}/terraform"

      # ══════════════════════════ install root ══════════════════════════════
      - name: "Terraform Validate (install)"
        id: validate-install
        working-directory: terraform/argocd/${{ matrix.environment }}/install
        env:
          TF_IN_AUTOMATION: "true"
        run: terraform validate -no-color

      - name: "Terraform Plan (install)"
        id: install-plan
        working-directory: terraform/argocd/${{ matrix.environment }}/install
        env:
          TF_IN_AUTOMATION: "true"
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          set +e
          terraform plan \
            -refresh=false \
            -out="${RUNNER_TEMP}/tfplan.install.${ENVIRONMENT}" \
            -no-color \
            -detailed-exitcode \
            -input=false \
            2>&1 | grep -v -iE "^\s*(token|secret|password)\s*=" \
            | tee "${RUNNER_TEMP}/plan_output.install.txt"
          PLAN_EXIT="${PIPESTATUS[0]}"
          set -e
          echo "exitcode=${PLAN_EXIT}" >> "${GITHUB_OUTPUT}"

          if [ "${PLAN_EXIT}" -eq 1 ]; then
            echo "::error::install terraform plan failed with exit code 1"
            exit 1
          fi

      - name: "Reject install delete or replacement"
        if: steps.install-plan.outputs.exitcode == '2'
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        working-directory: terraform/argocd/${{ matrix.environment }}/install
        run: |
          terraform show -json "${RUNNER_TEMP}/tfplan.install.${ENVIRONMENT}" \
            | jq -e 'all(.resource_changes[]?; (.change.actions | index("delete") | not))' \
              >/dev/null || {
                echo "::error::install plan contains delete or replacement"
                exit 1
              }

      # ══════════════════════════ self-manage root ═══════════════════════════
      - name: "Terraform Init (self-manage)"
        working-directory: terraform/argocd/${{ matrix.environment }}/self-manage
        run: terraform init -reconfigure -input=false

      - name: "Terraform Validate (self-manage)"
        id: validate-self-manage
        working-directory: terraform/argocd/${{ matrix.environment }}/self-manage
        env:
          TF_IN_AUTOMATION: "true"
        run: terraform validate -no-color

      - name: "Terraform Plan (self-manage)"
        id: self-manage-plan
        working-directory: terraform/argocd/${{ matrix.environment }}/self-manage
        env:
          TF_IN_AUTOMATION: "true"
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          set +e
          terraform plan \
            -out="${RUNNER_TEMP}/tfplan.self-manage.${ENVIRONMENT}" \
            -no-color \
            -detailed-exitcode \
            -input=false \
            2>&1 | grep -v -iE "^\s*(token|secret|password)\s*=" \
            | tee "${RUNNER_TEMP}/plan_output.self-manage.txt"
          PLAN_EXIT="${PIPESTATUS[0]}"
          set -e
          echo "exitcode=${PLAN_EXIT}" >> "${GITHUB_OUTPUT}"

          if [ "${PLAN_EXIT}" -eq 1 ]; then
            echo "::error::self-manage terraform plan failed with exit code 1"
            exit 1
          fi

      - name: "Reject self-manage delete or replacement"
        if: steps.self-manage-plan.outputs.exitcode == '2'
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        working-directory: terraform/argocd/${{ matrix.environment }}/self-manage
        run: |
          terraform show -json "${RUNNER_TEMP}/tfplan.self-manage.${ENVIRONMENT}" \
            | jq -e 'all(.resource_changes[]?; (.change.actions | index("delete") | not))' \
              >/dev/null || {
                echo "::error::self-manage plan contains delete or replacement"
                exit 1
              }

      # ══════════════════════════════ ateam root ═════════════════════════════
      - name: "Terraform Init (ateam)"
        working-directory: terraform/argocd/${{ matrix.environment }}/ateam
        run: terraform init -reconfigure -input=false

      - name: "Terraform Validate (ateam)"
        id: validate-ateam
        working-directory: terraform/argocd/${{ matrix.environment }}/ateam
        env:
          TF_IN_AUTOMATION: "true"
        run: terraform validate -no-color

      - name: "Terraform Plan (ateam)"
        id: ateam-plan
        working-directory: terraform/argocd/${{ matrix.environment }}/ateam
        env:
          TF_IN_AUTOMATION: "true"
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          set +e
          terraform plan \
            -out="${RUNNER_TEMP}/tfplan.ateam.${ENVIRONMENT}" \
            -no-color \
            -detailed-exitcode \
            -input=false \
            2>&1 | grep -v -iE "^\s*(token|secret|password)\s*=" \
            | tee "${RUNNER_TEMP}/plan_output.ateam.txt"
          PLAN_EXIT="${PIPESTATUS[0]}"
          set -e
          echo "exitcode=${PLAN_EXIT}" >> "${GITHUB_OUTPUT}"

          if [ "${PLAN_EXIT}" -eq 1 ]; then
            echo "::error::ateam terraform plan failed with exit code 1"
            exit 1
          fi

      - name: "Reject ateam delete or replacement"
        if: steps.ateam-plan.outputs.exitcode == '2'
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        working-directory: terraform/argocd/${{ matrix.environment }}/ateam
        run: |
          terraform show -json "${RUNNER_TEMP}/tfplan.ateam.${ENVIRONMENT}" \
            | jq -e 'all(.resource_changes[]?; (.change.actions | index("delete") | not))' \
              >/dev/null || {
                echo "::error::ateam plan contains delete or replacement"
                exit 1
              }

      # ══════════════════════════ private-network root ═══════════════════════
      - name: "Terraform Init (private network)"
        working-directory: terraform/argocd/${{ matrix.environment }}/private-network
        run: terraform init -reconfigure -input=false

      - name: "Terraform Validate (private network)"
        id: validate-private-network
        working-directory: terraform/argocd/${{ matrix.environment }}/private-network
        env:
          TF_IN_AUTOMATION: "true"
        run: terraform validate -no-color

      - name: "Terraform Plan (private network)"
        id: private-network-plan
        working-directory: terraform/argocd/${{ matrix.environment }}/private-network
        env:
          TF_IN_AUTOMATION: "true"
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          linode_token="$(aws ssm get-parameter \
            --name /gitops/shared/LINODE_TOKEN \
            --with-decryption \
            --query Parameter.Value \
            --output text)"
          test -n "${linode_token}"
          echo "::add-mask::${linode_token}"

          set +e
          LINODE_TOKEN="${linode_token}" terraform plan \
            -refresh=false \
            -out="${RUNNER_TEMP}/tfplan.private-network.${ENVIRONMENT}" \
            -no-color \
            -detailed-exitcode \
            -input=false \
            2>&1 | grep -v -iE "^\s*(token|secret|password)\s*=" \
            | tee "${RUNNER_TEMP}/plan_output.private-network.txt"
          PLAN_EXIT="${PIPESTATUS[0]}"
          set -e
          unset linode_token
          echo "exitcode=${PLAN_EXIT}" >> "${GITHUB_OUTPUT}"

          if [ "${PLAN_EXIT}" -eq 1 ]; then
            echo "::error::private-network terraform plan failed with exit code 1"
            exit 1
          fi

      - name: "Reject private endpoint delete or replacement"
        if: steps.private-network-plan.outputs.exitcode == '2'
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        working-directory: terraform/argocd/${{ matrix.environment }}/private-network
        run: |
          terraform show -json "${RUNNER_TEMP}/tfplan.private-network.${ENVIRONMENT}" \
            | jq -e 'all(.resource_changes[]?; (.change.actions | index("delete") | not))' \
              >/dev/null || {
                echo "::error::Private endpoint plan contains delete or replacement"
                exit 1
              }

      # ── 將 plan 結果發佈至 PR comment ─────────────────────────────────────
      - name: "Post Plan Summary to PR"
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        env:
          INSTALL_PLAN_EXITCODE: ${{ steps.install-plan.outputs.exitcode }}
          SELF_MANAGE_PLAN_EXITCODE: ${{ steps.self-manage-plan.outputs.exitcode }}
          ATEAM_PLAN_EXITCODE: ${{ steps.ateam-plan.outputs.exitcode }}
          PRIVATE_NETWORK_PLAN_EXITCODE: ${{ steps.private-network-plan.outputs.exitcode }}
          ENVIRONMENT: ${{ matrix.environment }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const read = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch (_) { return '(plan output not available)'; } };

            const installPlan = read(`${process.env.RUNNER_TEMP}/plan_output.install.txt`);
            const selfManagePlan = read(`${process.env.RUNNER_TEMP}/plan_output.self-manage.txt`);
            const ateamPlan = read(`${process.env.RUNNER_TEMP}/plan_output.ateam.txt`);
            const privateNetworkPlan = read(`${process.env.RUNNER_TEMP}/plan_output.private-network.txt`);

            const icon  = (r) => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';
            const env   = process.env.ENVIRONMENT;

            const planBadge = (code) => {
              if (code === '0') return '✅ No changes — infrastructure is up-to-date';
              if (code === '2') return '⚠️ Changes detected — review before applying';
              return '❌ Plan failed — check the Actions log';
            };

            // 四個 section 加總後仍須低於 GitHub issue comment 的大小上限。
            const MAX = 12_000;
            const clip = (s) => s.length > MAX ? s.slice(0, MAX) + '\n\n…(truncated — see full output in Actions run)' : s;

            const section = (title, code, output) => [
              `<details><summary>📄 ${title} Plan Output (${planBadge(code)})</summary>`,
              '',
              '```hcl',
              clip(output),
              '```',
              '</details>',
              '',
            ].join('\n');

            const body = [
              `## 🔍 Terraform Plan — \`${env}\` environment`,
              '',
              `| Root | Status |`,
              `|------|--------|`,
              `| 📐 Format   | ${icon('${{ steps.fmt.outcome }}')} \`${{ steps.fmt.outcome }}\` |`,
              `| 📋 install | ${planBadge(process.env.INSTALL_PLAN_EXITCODE)} |`,
              `| 📋 self-manage | ${planBadge(process.env.SELF_MANAGE_PLAN_EXITCODE)} |`,
              `| 📋 ateam | ${planBadge(process.env.ATEAM_PLAN_EXITCODE)} |`,
              `| 📋 private-network | ${planBadge(process.env.PRIVATE_NETWORK_PLAN_EXITCODE)} |`,
              '',
              section('install', process.env.INSTALL_PLAN_EXITCODE, installPlan),
              section('self-manage', process.env.SELF_MANAGE_PLAN_EXITCODE, selfManagePlan),
              section('ateam', process.env.ATEAM_PLAN_EXITCODE, ateamPlan),
              section('private-network', process.env.PRIVATE_NETWORK_PLAN_EXITCODE, privateNetworkPlan),
              '---',
              `> @${{ github.actor }} · \`${{ github.event.pull_request.head.sha }}\` · [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
            ].join('\n');

            const MARKER = `Terraform Plan — \`${env}\` environment`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      # ── 若任一 root 的 plan 失敗，讓整個 job 失敗 ─────────────────────────
      - name: "Fail job if any plan errored"
        if: steps.install-plan.outputs.exitcode == '1' || steps.self-manage-plan.outputs.exitcode == '1' || steps.ateam-plan.outputs.exitcode == '1' || steps.private-network-plan.outputs.exitcode == '1'
        run: exit 1
