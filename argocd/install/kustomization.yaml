apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

# ── 上游官方 manifest（固定版本，避免 stable 浮動指針）──────────────────────
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.3.9/manifests/install.yaml

# ── 公司客製化 patches ────────────────────────────────────────────────────────
# 使用明確 target 選擇器，避免 Kustomize 在遠端 manifest 中找不到對應資源
patches:
  - path: patches/argocd-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
  - path: patches/argocd-server.yaml
    target:
      kind: Deployment
      name: argocd-server
  # ApplicationSet Progressive Syncs 開關的唯一設定來源
  - path: patches/argocd-cmd-params-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
  # 只帶 rollout 觸發用的 pod template annotation，不重複定義開關值
  - path: patches/argocd-applicationset-controller.yaml
    target:
      kind: Deployment
      name: argocd-applicationset-controller
